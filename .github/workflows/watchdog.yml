# Independent Autopilot watchdog. It judges the GitHub Actions run history itself, so it notices runs that failed,
# hung, were cancelled or NEVER STARTED, and raises one de-duplicated GitHub issue (label `autopilot-incident`),
# which notifies repository watchers. It closes the issue with a recovery note once healthy.
# Triggers: started by the dispatcher every hour (:17) and 10 min after each critical :40 slot (runs dispatched with
# GITHUB_TOKEN never fire workflow_run), after Autopilot runs started by a person (workflow_run), the cron below
# (unreliable on GitHub) and manually.
# Known gap: if GitHub stops ALL scheduled workflows, the hourly trigger stops too — see the runbook, section 17.
name: Autopilot watchdog
on:
  workflow_run:
    workflows: [Autopilot]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  actions: write    # catch-up: start an overdue Autopilot run or restart the dispatcher
  issues: write
  contents: read
concurrency:
  group: watchdog
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: backend/fil, fetch-depth: 1, persist-credentials: false }
      - name: Collect run history
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3; do
            if gh api "repos/$GH_REPO/actions/workflows/autopilot.yml/runs?per_page=100" > runs.json \
               && jq -e '.workflow_runs | type == "array"' runs.json > /dev/null; then ok=1; break; fi
            echo "::warning::GitHub API attempt $i failed"; sleep $((i * 10))
          done
          # an API error must never be judged as "no runs" (that would raise a false incident)
          [ "$ok" = 1 ] || { echo "::error::could not read the Autopilot run history — no judgement made"; exit 1; }
          # the schedule in force since the workflow file last changed (earlier slots are not judged)
          gh api "repos/$GH_REPO/commits?path=.github/workflows/autopilot.yml&per_page=1" -q '.[0].commit.committer.date' > first_seen.txt || echo "" > first_seen.txt
          gh label create autopilot-incident --color B60205 --description "Opened/closed automatically by the Autopilot watchdog" 2>/dev/null || true
          gh api "repos/$GH_REPO/actions/workflows/dispatcher.yml/runs?per_page=20" > dispatcher_runs.json || echo '{"workflow_runs":[]}' > dispatcher_runs.json
          jq -e '.workflow_runs | type == "array"' dispatcher_runs.json > /dev/null || echo '{"workflow_runs":[{"status":"in_progress"}]}' > dispatcher_runs.json
          gh issue list --label autopilot-incident --state open --json number,body,comments --limit 5 > issues.json
      - name: Evaluate
        run: |
          set -euo pipefail
          FS=$(cat first_seen.txt)
          python3 backend/fil/ops/watchdog.py --runs runs.json --issues issues.json --out decision.json --dispatcher-runs dispatcher_runs.json ${FS:+--first-seen "$FS"} >> "$GITHUB_STEP_SUMMARY"
      - name: Act on decision
        run: |
          set -uo pipefail
          action=$(jq -r '.decision.action' decision.json)
          echo "watchdog decision: $action (status $(jq -r .status decision.json))"
          jq -r '.decision.body // empty' decision.json > body.md
          # 1) self-healing first, so a failing notification can never block it (see watchdog.py catch_up)
          cu_fail=0
          while read -r a; do
            wf=$(echo "$a" | jq -r .workflow); job=$(echo "$a" | jq -r '.job // empty'); why=$(echo "$a" | jq -r .reason)
            if if [ -n "$job" ]; then gh workflow run "$wf" --ref main -f job="$job"; else gh workflow run "$wf" --ref main; fi; then
              echo "- catch-up started: \`$wf\` ${job} ($why)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::catch-up $wf ${job} could not be started"; cu_fail=1
            fi
          done < <(jq -c '.catch_up[]' decision.json)
          # 2) notification, idempotent with retries: GitHub's GraphQL API failed twice on 2026-11-25 (15:50, 16:17)
          #    and delayed incident #21 by ~87 min. Before every attempt we check (REST) whether an earlier attempt
          #    already succeeded, so a half-failed call never creates a duplicate issue or comment.
          num=$(jq -r '.decision.issue // empty' decision.json); title=$(jq -r '.decision.title // empty' decision.json)
          fp=$(grep -o 'watchdog-fingerprint: [a-z0-9]*' body.md | head -1)
          open_with_title() { gh api "repos/$GH_REPO/issues?labels=autopilot-incident&state=open" --jq "[.[] | select(.title == \"$title\")] | length" 2>/dev/null | grep -qv '^0$'; }
          fp_posted() { [ -n "$fp" ] && gh api "repos/$GH_REPO/issues/$num/comments?per_page=100" --jq '.[].body' 2>/dev/null | grep -qF "$fp"; }
          is_closed() { [ "$(gh api "repos/$GH_REPO/issues/$num" --jq .state 2>/dev/null)" = closed ]; }
          attempt() {  # attempt <already-done check> <command...>: 4 tries (0/15/30/60 s), REST used for every try
            local done_check=$1; shift
            for d in 0 15 30 60; do sleep "$d"; $done_check && return 0; "$@" > /dev/null && return 0; echo "::warning::attempt failed: $1 $2"; done
            $done_check
          }
          ok=0
          case "$action" in
            create)  attempt open_with_title gh api "repos/$GH_REPO/issues" -f title="$title" -F body=@body.md -f 'labels[]=autopilot-incident' && ok=1 ;;
            comment) attempt fp_posted gh api "repos/$GH_REPO/issues/$num/comments" -F body=@body.md && ok=1 ;;
            close)   attempt fp_posted gh api "repos/$GH_REPO/issues/$num/comments" -F body=@body.md &&
                     attempt is_closed gh api -X PATCH "repos/$GH_REPO/issues/$num" -f state=closed -f state_reason=completed && ok=1 ;;
            none)    echo "no notification needed: $(jq -r '.decision.reason' decision.json)"; ok=1 ;;
          esac
          if [ "$(jq -r .status decision.json)" = FAILED ] || [ "$(jq -r .status decision.json)" = STALE ]; then
            echo "::error::Autopilot is $(jq -r .status decision.json) — see the incident issue"
          fi
          # an undelivered notification or a failed catch-up fails this run (visible in Actions; retried next check)
          [ "$ok" = 1 ] || { echo "::error::incident notification ($action) could not be delivered"; exit 1; }
          [ "$cu_fail" = 0 ] || exit 1
