# Autonomous operation on free GitHub-hosted runners. Runbook: docs/reliability/AUTOPILOT_RUNBOOK.md
#
# Persistence model:
#   * release `db-latest`  : fil.db.gz + manifest.json (row counts of the immutable tables). The DB is uploaded
#                            FIRST and the manifest LAST, so an interrupted upload never leaves a manifest that
#                            describes a database that was not uploaded.
#   * release `db-backups` : dated, integrity-verified copies from daily runs (14 kept)
#   * workflow artifact    : the database of every non-live run, kept 30 days
# Safety rules:
#   * if `db-latest` exists but cannot be downloaded or fails validation, the run FAILS: it never falls back to an
#     older snapshot, never persists, and never exports a dashboard from an empty database;
#   * the restored database must hold at least as many immutable records as its manifest says (stale-asset check);
#   * a database is only uploaded if it passes integrity checks AND none of the immutable tables shrank.
#   * the dashboard's operational status (data/ops_status.json) is ALWAYS republished, also after failures, on
#     top of the last good dashboard data.
# Schedule routing lives in backend/fil/ops/schedule.py (tested); cron is UTC, no daylight-saving shift.
name: Autopilot
run-name: "Autopilot · ${{ github.event.schedule || inputs.job || 'manual' }}"
on:
  schedule:
    - cron: "10 5 * * *"            # daily full cycle (06:10 Rome in winter, 07:10 in summer)
    - cron: "40 */3 * * *"          # results + fixtures/odds + predictions every 3 h
    - cron: "25 6 * * 1"            # weekly report, backtests, Engine B validation (Monday)
    - cron: "7,27,47 11-23 * * *"   # live polling; minutes chosen so it never coincides with the :40 run
  workflow_dispatch:
    inputs:
      job:
        description: "job(s), comma-separated: daily, fixtures_odds, results, prematch_review, weekly, live, engine_b, backup"
        default: daily
permissions:
  contents: write   # publish gh-pages and the db-latest / db-backups release assets
concurrency:
  group: autopilot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIL_DB_PATH: data/fil.db
      FIL_SCHEDULER: "0"
      FIL_SINGLE_RUNNER: "1"
      OPS_RUN_ID: ${{ github.run_id }}
      OPS_RUN_ATTEMPT: ${{ github.run_attempt }}
      OPS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      OPS_EVENT: ${{ github.event_name }}
      OPS_SCHEDULE: ${{ github.event.schedule }}
      OPS_SHA: ${{ github.sha }}
    steps:
      - name: Record start
        run: echo "OPS_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: provider-cache-${{ github.run_id }}
          restore-keys: provider-cache-
      - run: pip install -r backend/requirements.txt
      - run: cd frontend && npm ci --no-audit --no-fund && npm run build

      - name: Restore database (fail closed)
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          if gh release view db-latest >/dev/null 2>&1; then
            ok=0
            for i in 1 2 3 4; do
              rm -f data/fil.db.gz data/manifest.json
              if gh release download db-latest -p fil.db.gz -p manifest.json -D data --clobber && gzip -t data/fil.db.gz; then ok=1; break; fi
              echo "::warning::database download attempt $i failed or was truncated"; sleep $((i * 15))
            done
            [ "$ok" = 1 ] || { echo "::error::db-latest exists but could not be downloaded intact — refusing to continue (no fallback to an older snapshot)"; exit 1; }
            gunzip -f data/fil.db.gz
            [ -f data/manifest.json ] && mv data/manifest.json data/manifest.prev.json
            echo "source=release" >> "$GITHUB_OUTPUT"; echo "OPS_RESTORE_SOURCE=release" >> "$GITHUB_ENV"
          elif [ -f data/snapshot/fil.db.gz ]; then
            gunzip -c data/snapshot/fil.db.gz > data/fil.db
            echo "source=snapshot" >> "$GITHUB_OUTPUT"; echo "OPS_RESTORE_SOURCE=snapshot" >> "$GITHUB_ENV"
          else
            echo "source=none" >> "$GITHUB_OUTPUT"; echo "OPS_RESTORE_SOURCE=none" >> "$GITHUB_ENV"
          fi
          cd backend
          if [ -f ../data/fil.db ]; then
            # 1) raw, read-only check BEFORE migrations (a removed trigger is detected, not re-created)
            python -m fil integrity --pre-migration
            # 2) the restored file must not be older than its manifest (stale or mismatched asset)
            if [ -f ../data/manifest.prev.json ]; then python -m fil guard --pre-migration ../data/fil.db ../data/manifest.prev.json; fi
            # 3) add tables/triggers introduced by newer releases, then the full check
            python -m fil migrate
            python -m fil integrity
          fi

      - name: Pick job
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED: ${{ inputs.job }}
          DB_SOURCE: ${{ steps.restore.outputs.source }}
        run: |
          set -euo pipefail
          JOB=$(cd backend && python -m fil.ops.schedule)
          echo "job=$JOB" >> "$GITHUB_OUTPUT"; echo "OPS_JOB=$JOB" >> "$GITHUB_ENV"
          echo "Routing: event=$EVENT schedule='$SCHEDULE' -> $JOB"

      - name: Run
        id: runjob
        env:
          JOBS: ${{ steps.pick.outputs.job }}
          # provider keys are passed ONLY to this step (never to build, export, persist or summary steps)
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -uo pipefail
          for k in FOOTBALL_DATA_ORG_KEY ODDS_API_KEY API_FOOTBALL_KEY; do
            if [ -n "${!k}" ]; then echo "$k: configured"; else echo "$k: not configured"; fi
          done
          cd backend
          worst=success
          for j in $(echo "$JOBS" | tr ',' ' '); do
            rm -f /tmp/job.status
            python -m fil job "$j" --status-out /tmp/job.status; rc=$?
            st=$(cat /tmp/job.status 2>/dev/null || echo error)
            [ $rc -ne 0 ] && st=error
            echo "job $j -> $st"
            case "$st" in
              error) worst=error; echo "::error::job $j failed (critical step failed or every step failed)";;
              partial) [ "$worst" = success ] && worst=partial; echo "::warning::job $j finished PARTIAL (a non-critical step failed — see run report)";;
              skipped) [ "$worst" = success ] && worst=skipped; echo "::warning::job $j was skipped (another run holds the lease)";;
            esac
          done
          echo "OPS_JOB_STATUS=$worst" >> "$GITHUB_ENV"
          [ "$worst" != error ]

      - name: Persist database (guarded)
        id: persist
        # never persist after a failed or skipped restore: that database is empty or unvalidated
        if: always() && steps.restore.outcome == 'success' && steps.pick.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ steps.pick.outputs.job }}
        run: |
          set -euo pipefail
          retry() { for i in 1 2 3; do "$@" && return 0; echo "::warning::attempt $i failed: $*"; sleep $((i * 10)); done; return 1; }
          python - <<'PY'
          import sqlite3; c = sqlite3.connect("data/fil.db"); c.execute("PRAGMA wal_checkpoint(TRUNCATE)"); c.close()
          PY
          cd backend
          if ! python -m fil guard ../data/fil.db ../data/manifest.prev.json; then
            echo "OPS_PERSIST=refused" >> "$GITHUB_ENV"; echo "OPS_PERSIST_DETAIL=guard refused (integrity or shrinking ledger)" >> "$GITHUB_ENV"
            echo "::error::database NOT persisted: guard refused"; exit 1
          fi
          python -m fil manifest ../data/manifest.json > /dev/null
          cd ..
          # live polling: upload only if the audit tables changed (saves ~37 MB per 20-minute run)
          if [ "$JOB" = live ] && [ -f data/manifest.prev.json ] && python - <<'PY'
          import json, sys
          a = json.load(open("data/manifest.prev.json")); b = json.load(open("data/manifest.json"))
          sys.exit(0 if a == b else 1)
          PY
          then
            echo "OPS_PERSIST=unchanged" >> "$GITHUB_ENV"; echo "OPS_PERSIST_DETAIL=live run made no new records" >> "$GITHUB_ENV"
            echo "live run: no new records, persisted database left unchanged"; exit 0
          fi
          gzip -kf data/fil.db
          gh release view db-latest >/dev/null 2>&1 || gh release create db-latest --title "Database (latest)" --notes "Automated SQLite snapshot of the Football Intelligence Lab. Do not edit." --latest=false
          echo "OPS_PERSIST=failed" >> "$GITHUB_ENV"
          retry gh release upload db-latest data/fil.db.gz --clobber      # database first ...
          retry gh release upload db-latest data/manifest.json --clobber  # ... manifest last
          if [ "$JOB" = daily ]; then
            gh release view db-backups >/dev/null 2>&1 || gh release create db-backups --title "Database backups" --notes "Dated, integrity-verified daily copies (14 kept)." --latest=false
            cp data/fil.db.gz "data/fil-$(date -u +%Y%m%d).db.gz"
            retry gh release upload db-backups "data/fil-$(date -u +%Y%m%d).db.gz" --clobber
            gh release view db-backups --json assets -q '.assets[].name' | sort | head -n -14 | xargs -r -I{} gh release delete-asset db-backups {} -y
          fi
          echo "OPS_PERSIST=persisted" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: always() && steps.restore.outcome == 'success' && steps.pick.outputs.job != 'live'
        with: { name: "fil-db-${{ github.run_id }}", path: data/fil.db.gz, retention-days: 30, if-no-files-found: ignore }

      - name: Export static dashboard
        id: export
        # only from a validated database; after a failed restore the previous dashboard data stays published
        if: always() && steps.restore.outcome == 'success'
        run: |
          set -euo pipefail
          rm -rf site.new
          (cd backend && python -m fil export-static ../site.new)
          [ -s site.new/data/health.json ] && [ -s site.new/index.html ] || { echo "::error::incomplete dashboard export"; exit 1; }
          rm -rf site && mv site.new site

      - name: Operational status (always)
        if: always()
        env:
          OPS_RESTORE: ${{ steps.restore.outcome }}
          OPS_ROUTE: ${{ steps.pick.outcome }}
          OPS_EXPORT: ${{ steps.export.outcome }}
          OPS_PERSIST_STEP: ${{ steps.persist.outcome }}
        run: |
          set -uo pipefail
          # the previously published dashboard: carries the run history and is reused if this export did not run
          rm -rf prev_site
          git clone -q --depth 1 -b gh-pages "${{ github.server_url }}/${{ github.repository }}.git" prev_site || mkdir -p prev_site
          if [ ! -d site ]; then
            if [ -f prev_site/index.html ]; then cp -r prev_site site && rm -rf site/.git; else mkdir -p site; fi
            echo "::warning::publishing the previous dashboard data with an updated operational status"
          fi
          (cd backend && python -m fil.ops.status --site ../site --prev ../prev_site/data/ops_history.json)

      - name: Publish dashboard to gh-pages
        id: publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f site/data/ops_status.json ] || { echo "::error::nothing to publish"; exit 1; }
          cd site && touch .nojekyll
          git init -q -b gh-pages && git add -A
          git -c user.name="fil-autopilot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Dashboard snapshot $(date -u +%Y-%m-%dT%H:%MZ) (run ${{ github.run_id }})"
          # generated branch, replaced on every run so the repository does not grow
          for i in 1 2 3; do
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages && exit 0
            echo "::warning::gh-pages push attempt $i failed"; sleep $((i * 10))
          done
          echo "::error::dashboard could not be published"; exit 1

      - name: Run report
        if: always()
        continue-on-error: true   # reporting only; never changes the run's outcome
        run: |
          {
            echo "## Autopilot — ${OPS_JOB:-not routed}"
            echo
            echo "| Stage | Outcome |"; echo "|---|---|"
            echo "| restore | ${{ steps.restore.outcome }} (${OPS_RESTORE_SOURCE:-—}) |"
            echo "| route | ${{ steps.pick.outcome }} |"
            echo "| run | ${{ steps.runjob.outcome }} (job status: ${OPS_JOB_STATUS:-none}) |"
            echo "| persist | ${OPS_PERSIST:-not attempted} ${OPS_PERSIST_DETAIL:+— $OPS_PERSIST_DETAIL} |"
            echo "| export | ${{ steps.export.outcome }} |"
            echo "| publish | ${{ steps.publish.outcome }} |"
            echo
            if [ -f data/fil.db ] && [ "${{ steps.restore.outcome }}" = success ]; then (cd backend && python -m fil run-report --last 3); fi
          } >> "$GITHUB_STEP_SUMMARY"
