# Reliable Autopilot timer. GitHub's `schedule:` trigger is best effort (on 23–25 Nov 2026 most slots never started,
# some arrived 10 h late), so this long-lived workflow wakes every minute and starts each slot of
# backend/fil/ops/schedule.py with workflow_dispatch, which GitHub runs immediately. After ~5h45 it starts its own
# successor. If the chain ever breaks, it is restarted by the cron below or by the watchdog (catch-up).
# Cost: one runner held continuously — free for public repositories.
name: Autopilot dispatcher
on:
  workflow_dispatch:
  schedule:
    - cron: "53 */2 * * *"   # fallback restart only; exits at once if a dispatcher is already running
permissions:
  actions: write    # start Autopilot runs and the next dispatcher
  contents: read
concurrency:
  group: dispatcher
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: backend/fil, fetch-depth: 1, persist-credentials: false }
      - name: Exit if another dispatcher is already running
        id: single
        run: |
          set -euo pipefail
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/dispatcher.yml/runs?status=in_progress" -q "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length")
          echo "others=$n" >> "$GITHUB_OUTPUT"; echo "other running dispatchers: $n"
      - name: Dispatch Autopilot slots on time
        if: steps.single.outputs.others == '0'
        run: python3 backend/fil/ops/dispatcher.py --repo "${{ github.repository }}" --max-minutes 345
